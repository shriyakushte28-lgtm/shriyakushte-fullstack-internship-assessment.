spring.application.name=StudentInternshipPortal

# ==========================
# DATABASE CONFIGURATION
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/internship_portal_db
spring.datasource.username=root
spring.datasource.password=Shriya@28

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

