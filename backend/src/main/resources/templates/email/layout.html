<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>InternSphere</title>

</head>

<body
    style="
        margin:0;
        padding:30px;
        background:#f3f4f6;
        font-family:Arial,Helvetica,sans-serif;
    ">

<table
        width="100%"
        cellpadding="0"
        cellspacing="0">

<tr>

<td align="center">

<table
        width="650"
        cellpadding="0"
        cellspacing="0"
        style="
            background:#ffffff;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 2px 12px rgba(0,0,0,.08);
        ">

<!-- Header -->

<tr>

<td
        style="
            background:#2563eb;
            color:white;
            padding:28px;
            text-align:center;
        ">

<h1
        style="
            margin:0;
            font-size:30px;
        ">

InternSphere

</h1>

<p
        style="
            margin-top:8px;
            font-size:15px;
        ">

Student Internship Portal

</p>

</td>

</tr>

<!-- Dynamic Content -->

<tr>

<td
        style="
            padding:40px;
        ">

<div th:replace="${content}"></div>

</td>

</tr>

<!-- Footer -->

<tr>

<td
        style="
            background:#f8fafc;
            padding:25px;
            text-align:center;
            color:#64748b;
            font-size:13px;
        ">

<p style="margin:0;">

© 2026 InternSphere

</p>

<p
style="margin-top:8px;">

Helping students launch their careers.

</p>

</td>

</tr>

</table>

</td>

</tr>

</table>

</body>

</html>
