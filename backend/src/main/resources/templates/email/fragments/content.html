<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="button(text,url)">

<a

th:href="${url}"

style="
display:inline-block;
padding:12px 26px;
background:#2563eb;
color:white;
text-decoration:none;
border-radius:8px;
font-weight:bold;
">

<span th:text="${text}"></span>

</a>

</div>

</body>

</html>
